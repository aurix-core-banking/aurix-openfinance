name: Aurix Open Finance CI

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  verify-openfinance:
    name: Architecture Invariants (INV-001..007), Contracts & Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Architecture Invariants (INV-001 to INV-006) & YAML Governance
        run: mvn -B test -Dtest=ArchitectureTest,ArchitectureYamlSchemaTest,SchemaCompatibilityTest,ConsentServiceContractTest

      - name: Run Full Maven Test Suite (Unit, Temporal Workflows & E2E)
        run: mvn -B test
