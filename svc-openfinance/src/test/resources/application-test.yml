server:
  port: 8096

spring:
  datasource:
    url: jdbc:h2:mem:aurix_openfinance_test;MODE=POSTGRESQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: aurix-openfinance-test

aurix:
  openfinance:
    bacen-url: http://localhost:8095
    consent-max-duration-days: 30
    rate-limit-per-second: 100
