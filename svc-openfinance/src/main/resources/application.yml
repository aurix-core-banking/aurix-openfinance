server:
  port: 8096

spring:
  application:
    name: svc-openfinance
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aurix_db}
    username: ${SPRING_DATASOURCE_USERNAME:aurix_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aurix_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
    schemas: aurix
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: aurix-openfinance
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.aurix.platform.shared.event"
        spring.json.use.type.headers: false
        spring.json.use.type.info: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

aurix:
  openfinance:
    bacen-url: ${AURIX_BACEN_URL:http://localhost:8095}
    consent-max-duration-days: ${AURIX_OF_CONSENT_MAX_DAYS:365}
    rate-limit-per-second: ${AURIX_OF_RATE_LIMIT:10}
