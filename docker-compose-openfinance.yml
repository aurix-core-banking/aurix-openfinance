version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=aurix_user
      - POSTGRES_PASSWORD=aurix_dev_password
      - POSTGRES_DB=aurix_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurix_user -d aurix_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1

  temporal-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=aurix
      - POSTGRES_PASSWORD=aurix
      - POSTGRES_DB=temporal

  temporal:
    image: temporalio/auto-setup:1.26.0
    depends_on:
      - temporal-postgres
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=aurix
      - POSTGRES_PASSWORD=aurix
      - POSTGRES_SEEDS=temporal-postgres
      - TEMPORAL_ADDRESS=localhost:7233
      - TEMPORAL_NAMESPACE=aurix

  temporal-ui:
    image: temporalio/ui:2.26.0
    depends_on:
      - temporal
    ports:
      - "8098:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233

  svc-openfinance:
    build: .
    ports:
      - "8096:8096"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      temporal:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8096
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aurix_db
      - SPRING_DATASOURCE_USERNAME=aurix_user
      - SPRING_DATASOURCE_PASSWORD=aurix_dev_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=aurix
