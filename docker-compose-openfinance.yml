version: '3.8'
services:
  svc-openfinance:
    build: .
    ports:
      - "8092:8092"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - postgres
      - kafka
      - temporal

  temporal:
    image: temporalio/auto-setup:1.26.0
    ports:
      - "7233:7233"
    environment:
      - DB=postgres
      - DB_PORT=5432
      - POSTGRES_USER=aurix
      - POSTGRES_PASSWORD=aurix
      - POSTGRES_SEEDS=postgres

  temporal-ui:
    image: temporalio/ui:2.21.0
    ports:
      - "8081:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
