# Architecture Compliance Rules
# Validação automática do modelo de arquitetura
#
# specVersion 2.0 — seletores alinhados a architecture/architecture.yaml (v2.0)
# e architecture/infrastructure.yaml. Cada regra é avaliada em CI por
# ArchitectureRulesComplianceTest (svc-openfinance/src/test/java/.../architecture),
# que falha se alguma regra listada aqui não tiver verificação correspondente.

specVersion: "2.0"

rules:

  # ─── Consent Invariants ───

  - id: RULE-001
    name: "No bypass consent"
    severity: CRITICAL
    description: "Nenhum componente pode acessar dados sem passar pelo Consent Plane"
    check: |
      architecture.planes.execution.components.extraction-planner.consumes CONTAINS "AuthorizedContext" AND
      architecture.planes.dataPlane.stages[id=extraction].requirements CONTAINS { authorized-context-required: true } AND
      architecture.pipeline.requirements.extract.authorizedContextRequired == true AND
      architecture.pipeline.requirements.authorize.policyCheck == "mandatory"
    violation: "Componente acessa dados sem authorized-context"
    reference: INV-001

  - id: RULE-002
    name: "Consent required for execution"
    severity: CRITICAL
    description: "Nenhum workflow pode iniciar sem consentimento válido e versionado"
    check: |
      architecture.idempotency.workflow.key CONTAINS ALL ["consentId", "consentVersion"] AND
      architecture.planes.execution.components.workflow-engine.workflows CONTAINS "DataExtractionWorkflow" AND
      architecture.planes.execution.components.workflow-engine.activities CONTAINS "ValidateConsentActivity"
    violation: "Workflow sem referência a consentimento"
    reference: INV-001

  # ─── Temporal Restrictions ───

  - id: RULE-003
    name: "Temporal no authorization"
    severity: CRITICAL
    description: "Temporal não pode acessar decisões de autorização"
    check: |
      architecture.planes.execution.components.workflow-engine.forbidden CONTAINS "authorization_decision" AND
      architecture.planes.execution.components.workflow-engine.allowed NOT CONTAINS "authorization_decision"
    violation: "Temporal tem acesso a decisões de autorização"
    reference: INV-004

  - id: RULE-004
    name: "Temporal no consent decisions"
    severity: CRITICAL
    description: "Temporal não pode tomar decisões de consentimento nem regulatórias"
    check: |
      architecture.planes.execution.components.workflow-engine.forbidden CONTAINS ALL
        ["consent_decision", "regulatory_policy_decision"]
    violation: "Temporal toma decisões de consentimento"
    reference: INV-004

  - id: RULE-005
    name: "Temporal no direct data access"
    severity: CRITICAL
    description: "Temporal não pode acessar dados diretamente"
    check: |
      architecture.planes.execution.components.workflow-engine.forbidden CONTAINS "direct_source_access"
    violation: "Temporal acessa dados diretamente"
    reference: INV-004

  # ─── Data Traceability ───

  - id: RULE-006
    name: "Lineage required before publication"
    severity: HIGH
    description: "Dados devem passar por lineage antes da publicação"
    check: |
      architecture.planes.dataPlane.stages.indexOf(id=lineage) < architecture.planes.dataPlane.stages.indexOf(id=publication) AND
      architecture.planes.dataPlane.stages[id=publication].requirements CONTAINS { lineage-created: true } AND
      architecture.pipeline.requirements.publish.requires CONTAINS "lineage_created"
    violation: "Publicação ocorre antes do registro de linhagem"
    reference: INV-003

  - id: RULE-007
    name: "Full traceability chain"
    severity: HIGH
    description: "Cadeia de rastreabilidade deve ser completa"
    check: |
      architecture.traceability.requiredChain CONTAINS ALL:
        ["consentId", "consentVersion", "resourceId", "executionPlanId", "temporalWorkflowId",
         "pipelineExecutionId", "sourceRecordId", "canonicalRecordId", "publicationId"]
    violation: "Cadeia de rastreabilidade incompleta"
    reference: INV-003

  # ─── Schema Evolution ───

  - id: RULE-008
    name: "Backward-compatible schema"
    severity: HIGH
    description: "Novos schemas devem ser compatíveis com versões anteriores"
    check: |
      architecture.planes.dataPlane.stages[id=schema-validation].requirements CONTAINS { backward-compatible: true } AND
      infrastructure.runtime.messaging.kafka.schemaRegistry.enabled == true AND
      infrastructure.runtime.messaging.kafka.schemaRegistry.compatibility == "BACKWARD"
    violation: "Schema registry não configurado com compatibilidade BACKWARD"
    reference: INV-007

  # ─── Pipeline Requirements ───

  - id: RULE-009
    name: "Every pipeline has reconciliation"
    severity: HIGH
    description: "Todo pipeline deve ter reconciliação"
    check: |
      architecture.planes.execution.components CONTAINS KEY "reconciliation" AND
      architecture.planes.execution.components.workflow-engine.workflows CONTAINS "ReconciliationWorkflow" AND
      infrastructure.runtime.temporal.taskQueues CONTAINS "openfinance-reconciliation"
    violation: "Pipeline sem componente de reconciliação"
    reference: execution-plane

  - id: RULE-010
    name: "Data stages complete"
    severity: MEDIUM
    description: "Pipeline de dados deve ter os 7 estágios, na ordem canônica"
    check: |
      architecture.planes.dataPlane.stages[*].id ==
        ["extraction", "canonicalization", "schema-validation", "data-quality",
         "pii-classification", "lineage", "publication"]
    violation: "Pipeline de dados com estágios faltando ou fora de ordem"
    reference: data-plane

  # ─── Security ───

  - id: RULE-011
    name: "FAPI-Brazil required"
    severity: CRITICAL
    description: "Autenticação deve usar FAPI-Brazil"
    check: |
      architecture.planes.trust.components.fapi-auth-server.responsibility CONTAINS "fapi-brazil-compliance" AND
      architecture.security.protocols CONTAINS "fapi-brazil" AND
      architecture.planes.distribution.channels.api.auth == "fapi-brazil"
    violation: "Servidor de autorização não implementa FAPI-Brazil"
    reference: trust-plane

  - id: RULE-012
    name: "Sender-constrained tokens"
    severity: CRITICAL
    description: "Tokens devem ser sender-constrained (DPoP)"
    check: |
      architecture.security.protocols CONTAINS "dpop" AND
      architecture.planes.trust.components.token-service.responsibility CONTAINS "sender-constrained-tokens" AND
      architecture.planes.trust.components.fapi-auth-server.responsibility CONTAINS "dpop-validation"
    violation: "Tokens não são sender-constrained"
    reference: trust-plane

  - id: RULE-013
    name: "mTLS required"
    severity: HIGH
    description: "Transporte deve usar mTLS"
    check: |
      architecture.security.protocols CONTAINS "mtls" AND
      architecture.planes.trust.components.tls-terminator.technology == "istio-mtls" AND
      infrastructure.runtime.serviceMesh.istio.features CONTAINS "mtls-strict"
    violation: "mTLS não configurado"
    reference: trust-plane

  # ─── Consent Versioning ───

  - id: RULE-014
    name: "Consent version immutable"
    severity: HIGH
    description: "Consentimento nunca é mutado — cria nova versão"
    check: |
      architecture.invariants CONTAINS record where record.rule == "CONSENT_VERSIONING" AND
      architecture.planes.consent.components.consent-service.responsibility CONTAINS "maintain_consent_versions"
    violation: "Consentimento pode ser mutado em vez de versionado"
    reference: INV-006

  # ─── Authorized Context ───

  - id: RULE-015
    name: "Authorized context immutable"
    severity: CRITICAL
    description: "Authorized context deve ser imutável e assinado"
    check: |
      architecture.planes.consent.components.authorized-context.type == "immutable-artifact" AND
      architecture.planes.consent.components.authorized-context.structure.fields CONTAINS ALL
        ["consentVersion", "signature", "dpopThumbprint"] AND
      architecture.invariants CONTAINS record where record.rule == "IMMUTABLE_AUTHORIZED_CONTEXT"
    violation: "Authorized context não é imutável"
    reference: INV-005

  # ─── Cross-cutting ───

  - id: RULE-016
    name: "Observability required"
    severity: MEDIUM
    description: "Plataforma deve ter observabilidade completa (OpenTelemetry + tracing distribuído)"
    check: |
      architecture.observability.standard == "opentelemetry" AND
      architecture.observability.requiredContext CONTAINS ALL ["traceId", "correlationId", "consentId"] AND
      architecture.technology.observability.traces == "jaeger" AND
      infrastructure.runtime.monitoring.jaeger.protocol == "OTLP"
    violation: "Observabilidade ou distributed tracing não configurados"
    reference: cross-cutting

  - id: RULE-017
    name: "Audit trail required"
    severity: HIGH
    description: "Trail de auditoria de decisões de política deve existir"
    check: |
      architecture.planes.consent.components.policy-engine.responsibility CONTAINS "audit_decisions" AND
      architecture.planes.consent.components.policy-engine.api CONTAINS "GET /api/v1/policy/decisions"
    violation: "Audit trail não configurado"
    reference: cross-cutting

  - id: RULE-018
    name: "Encryption at rest and in transit"
    severity: HIGH
    description: "Dados devem ser criptografados em repouso e trânsito"
    check: |
      architecture.security.sensitiveData.encryptionAtRest == "AES-256-GCM" AND
      architecture.security.sensitiveData.encryptionInTransit == "TLS-1.3" AND
      architecture.security.sensitiveData.piiDetection == "mandatory"
    violation: "Criptografia não configurada corretamente"
    reference: cross-cutting

  # ─── Distribution ───

  - id: RULE-019
    name: "Kafka topic naming"
    severity: MEDIUM
    description: "Topics Kafka devem seguir padrão {domain}.{entity}.{action}.{version} (ver architecture/events.yaml#namingConvention) — sem prefixo openfinance., já que o event bus é dedicado a este módulo"
    check: |
      events.namingConvention.pattern == "{domain}.{entity}.{action}.{version}" AND
      architecture.planes.distribution.channels.kafka.topicPattern == events.namingConvention.pattern AND
      infrastructure.runtime.messaging.kafka.topics.pattern == events.namingConvention.pattern
    violation: "Padrão de topics Kafka não segue convenção"
    reference: distribution-plane

  # ─── Domain Coverage ───

  - id: RULE-020
    name: "All domains have extractors"
    severity: MEDIUM
    description: "Toda capability de domínio deve declarar pipeline e extractor, e o extractor deve existir no código"
    check: |
      every capability in architecture.domains.*.capabilities:
        capability.pipeline IS NOT EMPTY AND
        capability.extractor IS NOT EMPTY AND
        class com.aurix.platform.openfinance.extractor.<capability.extractor> EXISTS AND EXTENDS BaseExtractor
    violation: "Domínio sem extractor implementado"
    reference: domains
