specVersion: "2.0"
kind: Architecture

metadata:
  name: open-finance-data-exchange
  description: >
    Plataforma de dados Open Finance Brasil — Consent-driven, policy-enforced,
    event-driven. Segue BACEN COMEX 35.145 e FAPI-Brazil Security Profile.
  architectureStyle:
    - consent-driven
    - policy-enforced
    - event-driven
    - capability-oriented
    - data-product-oriented

technology:
  language: java
  runtime: java-25
  framework: spring-boot-4.1.0
  cloud: spring-cloud-2025.1.2
  build: maven
  orm: jpa-hibernate
  migrations: flyway
  orchestration: temporal-1.26.0
  messaging: kafka
  transactionalDatabase: postgresql-15
  cache: redis-7
  analytics: clickhouse
  timeSeries: timescaleDB
  objectStorage: minio-s3
  search: elasticsearch
  identity: keycloak
  apiGateway: traefik
  serviceMesh: istio
  observability:
    standard: opentelemetry
    metrics: prometheus
    dashboards: grafana
    traces: jaeger
    logs: elk

invariants:
  - id: INV-001
    rule: NO_CONSENT_NO_EXECUTION
    severity: critical
    description: >
      Nenhum pipeline pode executar sem consentimento válido e ativo.
      Violation: extract data without valid consent → pipeline MUST fail.

  - id: INV-002
    rule: NO_AUTHORIZED_RESOURCE_NO_ACCESS
    severity: critical
    description: >
      Extractor só acessa recursos explicitamente autorizados pelo consentimento.
      Violation: access resource not in authorized context → extractor MUST reject.

  - id: INV-003
    rule: NO_LINEAGE_NO_PUBLICATION
    severity: critical
    description: >
      Dado sem rastreabilidade de linhagem não pode ser publicado.
      Violation: publish without lineage → pipeline MUST fail at publish stage.

  - id: INV-004
    rule: TEMPORAL_MUST_NOT_AUTHORIZE
    severity: critical
    description: >
      O engine Temporal NÃO interpreta regras regulatórias ou de autorização.
      Violation: Temporal activity containing authorization logic → ARCHITECTURE TEST FAIL.

  - id: INV-005
    rule: IMMUTABLE_AUTHORIZED_CONTEXT
    severity: critical
    description: >
      O contexto autorizado é imutável durante toda a execução.
      Violation: mutate authorized context → runtime MUST reject.

  - id: INV-006
    rule: CONSENT_VERSIONING
    severity: high
    description: >
      Alteração de consentimento cria nova versão, nunca muta a anterior.
      Violation: mutate existing consent → system MUST reject.

  - id: INV-007
    rule: SCHEMA_BACKWARD_COMPATIBLE
    severity: high
    description: >
      Novos schemas devem ser compatíveis com versões anteriores.
      Violation: breaking schema change → CI MUST fail.

planes:

  trust:
    components:
      fapi-auth-server:
        type: service
        technology: spring-security-oauth2
        responsibility:
          - oauth2-authorization
          - fapi-brazil-compliance
          - dpop-validation
          - token-introspection
        publishes:
          - token.issued.v1
          - token.revoked.v1

      tls-terminator:
        type: infrastructure
        technology: istio-mtls
        responsibility:
          - transport-encryption
          - certificate-validation

      token-service:
        type: service
        technology: spring-security
        responsibility:
          - jwt-issuance
          - sender-constrained-tokens
          - jwk-rotation
        publishes:
          - token.issued.v1

  consent:
    components:
      consent-service:
        type: service
        responsibility:
          - manage_consent
          - manage_permissions
          - manage_expiration
          - maintain_consent_versions
        persistence: postgresql
        publishes:
          - consent.granted.v1
          - consent.updated.v1
          - consent.revoked.v1
          - consent.expired.v1
        api:
          - POST /api/v1/consents
          - GET /api/v1/consents/{id}
          - PUT /api/v1/consents/{id}
          - DELETE /api/v1/consents/{id}
          - POST /api/v1/consents/{id}/authorize

      resource-discovery:
        type: service
        responsibility:
          - discover_authorized_resources
          - build_resource_graph
        input:
          - consentId
          - permissions[]
        output:
          schema: AuthorizedResourceGraph
        persistence: postgresql
        api:
          - POST /api/v1/resources/discover
          - GET /api/v1/resources/graph/{consentId}

      policy-engine:
        type: service
        responsibility:
          - evaluate_access
          - enforce_invariants
          - audit_decisions
        input:
          - subject
          - consent
          - purpose
          - permission
          - resource
        output:
          enum:
            - ALLOW
            - DENY
        persistence: postgresql
        api:
          - POST /api/v1/policy/evaluate
          - GET /api/v1/policy/rules
          - GET /api/v1/policy/decisions

      authorized-context:
        type: immutable-artifact
        responsibility:
          - carry_authorized_state
          - cryptographic_signature
        structure:
          fields:
            - contextId
            - subject
            - consentId
            - consentVersion
            - purpose
            - permissions[]
            - resourceGraph
            - validUntil
            - signingAlgorithm
            - dpopThumbprint
            - signature
        persistence: postgresql
        api:
          - POST /api/v1/contexts
          - GET /api/v1/contexts/{id}
          - POST /api/v1/contexts/{id}/validate
          - POST /api/v1/contexts/{id}/revoke

  execution:
    components:
      extraction-planner:
        type: service
        responsibility:
          - build_execution_dag
          - topological_sort
          - assign_idempotency_keys
          - validate_dag
        consumes:
          - AuthorizedContext
          - AuthorizedResourceGraph
        produces:
          - ExecutionPlan
        persistence: postgresql
        api:
          - POST /api/v1/plans
          - GET /api/v1/plans/{planId}
          - GET /api/v1/plans/{planId}/status
          - POST /api/v1/plans/{planId}/cancel

      execution-plan:
        type: immutable-artifact
        structure: DAG
        node_attributes:
          - nodeId
          - capability
          - resource
          - dependencies[]
          - authorization
          - retryPolicy
          - timeout
          - rateLimit
          - idempotencyKey
          - schemaVersion
        persistence: postgresql

      workflow-engine:
        technology: temporal-1.26.0
        taskQueues:
          - openfinance-extraction
          - openfinance-reconciliation
        allowed:
          - orchestration
          - retries
          - timeout
          - parallelism
          - cancellation
          - recovery
          - signal-handling
          - workflow-versioning
        forbidden:
          - authorization_decision
          - consent_decision
          - regulatory_policy_decision
          - direct_source_access
        workflows:
          - DataExtractionWorkflow
          - ConsentMonitoringWorkflow
          - ReconciliationWorkflow
        activities:
          - ExtractDataActivity
          - TransformDataActivity
          - PublishDataActivity
          - ValidateConsentActivity
          - ReconcileActivity

      reconciliation:
        type: service
        responsibility:
          - compare_expected_vs_extracted
          - detect_missing_resources
          - detect_divergences
          - trigger_repair
          - reprocess
        persistence: postgresql
        api:
          - GET /api/v1/reconciliation/{planId}/status
          - POST /api/v1/reconciliation/{planId}/repair
          - GET /api/v1/reconciliation/{planId}/report

  dataPlane:
    stages:
      - id: extraction
        input: source-system
        output: raw-record
        immutable: true
        requirements:
          - idempotent: true
          - authorized-context-required: true

      - id: canonicalization
        input: raw-record
        output: canonical-record
        requirements:
          - schema-versioning: true

      - id: schema-validation
        input: canonical-record
        output: validated-record
        requirements:
          - schema-registry: true
          - backward-compatible: true

      - id: data-quality
        input: validated-record
        output: quality-checked-record
        requirements:
          - score-threshold: 80

      - id: pii-classification
        input: quality-checked-record
        output: pii-classified-record
        requirements:
          - detection: mandatory
          - protection: mandatory

      - id: lineage
        input: pii-classified-record
        output: lineage-registered-record
        requirements:
          - mandatory: true
          - chain-complete: true

      - id: publication
        input: lineage-registered-record
        output: published-data
        requirements:
          - valid-authorization: true
          - successful-validation: true
          - lineage-created: true

  distribution:
    channels:
      kafka:
        enabled: true
        topicPattern: "{domain}.{event}.{version}"
      api:
        enabled: true
        auth: fapi-brazil
      dataProducts:
        enabled: true
        storage: clickhouse-minio
      subscriptions:
        enabled: true
        webhook: true

domains:
  accounts:
    capabilities:
      balances:
        pipeline: AccountBalancePipeline
        extractor: CoreAccountExtractor
        source: PostgreSQL
      transactions:
        pipeline: AccountTransactionPipeline
        extractor: CoreAccountExtractor
        source: PostgreSQL

  credit-cards:
    capabilities:
      accounts:
        pipeline: CreditCardAccountPipeline
        extractor: CoreCardExtractor
        source: PostgreSQL
      transactions:
        pipeline: CreditCardTransactionPipeline
        extractor: CoreCardExtractor
        source: PostgreSQL
      bills:
        pipeline: CreditCardBillPipeline
        extractor: CoreCardExtractor
        source: PostgreSQL

  loans:
    capabilities:
      contracts:
        pipeline: LoanContractPipeline
        extractor: CoreLoanExtractor
        source: PostgreSQL
      installments:
        pipeline: LoanInstallmentPipeline
        extractor: CoreLoanExtractor
        source: PostgreSQL

  investments:
    capabilities:
      positions:
        pipeline: InvestmentPositionPipeline
        extractor: CoreInvestmentExtractor
        source: PostgreSQL
      transactions:
        pipeline: InvestmentTransactionPipeline
        extractor: CoreInvestmentExtractor
        source: PostgreSQL

pipeline:
  requiredStages:
    - authorize
    - extract
    - normalize
    - validate
    - persist
    - publish

  requirements:
    authorize:
      policyCheck: mandatory
      description: "Policy Engine validates authorization before extraction"
    extract:
      idempotent: true
      authorizedContextRequired: true
      description: "Extractor requires AuthorizedContext, uses idempotencyKey"
    normalize:
      output: canonical-model
      description: "Raw data converted to canonical Open Finance format"
    validate:
      schemaValidation: mandatory
      dataQuality: mandatory
      description: "Schema Registry + quality scoring (threshold 80)"
    persist:
      lineage: mandatory
      description: "Lineage chain registered before storage"
    publish:
      requires:
        - valid_authorization
        - successful_validation
        - lineage_created
        - idempotency_verified
      description: "Publication gated on full pipeline success"

idempotency:
  workflow:
    key:
      - consentId
      - consentVersion
      - executionPurpose
  pipeline:
    key:
      - executionId
      - capability
  record:
    key:
      - sourceSystem
      - resourceType
      - resourceId
      - sourceVersion

traceability:
  requiredChain:
    - consentId
    - consentVersion
    - resourceId
    - executionPlanId
    - temporalWorkflowId
    - pipelineExecutionId
    - sourceRecordId
    - canonicalRecordId
    - publicationId

security:
  principles:
    - zero-trust
    - least-privilege
    - defense-in-depth
  protocols:
    - fapi-brazil
    - oauth2
    - oidc
    - mtls
    - dpop
  sensitiveData:
    encryptionAtRest: AES-256-GCM
    encryptionInTransit: TLS-1.3
    piiDetection: mandatory
    piiProtection: mask-hash-encrypt

observability:
  standard: opentelemetry
  requiredContext:
    - traceId
    - correlationId
    - consentId
    - executionId
    - workflowId
    - pipelineExecutionId
  requiredMetrics:
    - consent_approval_rate
    - extraction_success_rate
    - pipeline_latency_p99
    - reconciliation_divergence_rate
    - data_freshness
    - policy_decision_rate

failureHandling:
  transient:
    strategy: temporal-retry
    maxRetries: 3
    backoff: exponential
  permanent:
    strategy: dlq
    notification: kafka
  consentRevoked:
    action:
      - cancel_affected_workflows
      - prevent_new_source_access
      - mark_in_progress_as_cancelled
  partialExtraction:
    action:
      - mark_partial
      - reconcile
      - repair
      - reprocess
  duplicate:
    action:
      - discard_by_idempotency_key
