openapi: 3.0.3
info:
  title: Aurix Open Finance Brasil API
  description: |
    APIs do Open Finance Brasil (BACEN) seguindo o padrão FAPI-Brazil.
    **Fase 1**: Contas, transações, saldos, consentimento, dados pessoais.
    **Fase 2**: Cartões de crédito, faturas, transações de cartão.
    **Fase 3**: Empréstimos, seguros, PIX.
  version: 1.0.0
  contact:
    name: Aurix Platform
    url: https://github.com/aurix-core-banking

servers:
  - url: http://localhost:8096
    description: Desenvolvimento local

tags:
  - name: Consentimentos
    description: Gerenciamento de consentimentos (FAPI-Brazil)
  - name: Contas
    description: Dados de contas (Fase 1)
  - name: Transações
    description: Transações de contas (Fase 1)
  - name: Dados Pessoais
    description: Identificação, endereços, contatos (Fase 1)
  - name: Cartões de Crédito
    description: Cartões de crédito (Fase 2)
  - name: Faturas
    description: Faturas de cartão (Fase 2)
  - name: Transações de Cartão
    description: Transações de cartão de crédito (Fase 2)
  - name: Empréstimos
    description: Empréstimos e financiamentos (Fase 3)
  - name: Seguros
    description: Apólices de seguro (Fase 3)
  - name: PIX
    description: Transferências PIX (Fase 3)
  - name: Health
    description: Health check

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.openfinancebrasil.org.br/oauth/authorize
          tokenUrl: https://auth.openfinancebrasil.org.br/oauth/token
          scopes:
            openid: OpenID Connect
            consents: Gerenciar consentimentos
            accounts: Acessar dados de contas
            credit-cards: Acessar dados de cartões
            loans: Acessar dados de empréstimos
            insurance: Acessar dados de seguros
            pix: Acessar dados de PIX
            customers: Acessar dados pessoais

  schemas:
    ConsentimentoRequest:
      type: object
      required: [clientId, permissions]
      properties:
        clientId:
          type: string
          description: Identificador do cliente (receptor)
        permissions:
          type: array
          items:
            type: string
            enum: [accounts, credit-cards, loans, insurance, pix, customers]
          description: Permissões solicitadas
        expirationDateTime:
          type: string
          format: date-time
          description: Data/hora de expiração (máx 365 dias)
        transactionFromDateTime:
          type: string
          format: date-time
        transactionToDateTime:
          type: string
          format: date-time

    ConsentimentoResponse:
      type: object
      properties:
        consentId:
          type: string
        clientId:
          type: string
        status:
          type: string
          enum: [AWAITING_AUTHORISATION, AUTHORISED, REJECTED, REVOKED, EXPIRED]
        permissions:
          type: array
          items:
            type: string
        dataCriacao:
          type: string
          format: date-time
        dataExpiracao:
          type: string
          format: date-time
        version:
          type: integer

    ContaResponse:
      type: object
      properties:
        contaId:
          type: string
        agencia:
          type: string
        numero:
          type: string
        tipoConta:
          type: string
        moeda:
          type: string
        statusConta:
          type: string
        nomeInstituicao:
          type: string
        cnpjInstituicao:
          type: string
        dataAbertura:
          type: string
          format: date

    SaldoResponse:
      type: object
      properties:
        contaId:
          type: string
        saldoDisponivel:
          type: number
        saldoBloqueado:
          type: number
        moeda:
          type: string
        dataAtualizacao:
          type: string
          format: date-time

    TransacaoResponse:
      type: object
      properties:
        transactionId:
          type: string
        valor:
          type: number
        moeda:
          type: string
        tipoTransacao:
          type: string
        descricao:
          type: string
        dataTransacao:
          type: string
          format: date-time

    PessoaResponse:
      type: object
      properties:
        pessoaId:
          type: string
        tipoDocumento:
          type: string
        documento:
          type: string
        nomeCompleto:
          type: string
        nomeSocial:
          type: string
        dataNascimento:
          type: string
          format: date
        telefone:
          type: string
        email:
          type: string
        endereco:
          type: object
          properties:
            logradouro:
              type: string
            numero:
              type: string
            complemento:
              type: string
            bairro:
              type: string
            cidade:
              type: string
            estado:
              type: string
            cep:
              type: string

    CartaoResponse:
      type: object
      properties:
        cartaoId:
          type: string
        bandeira:
          type: string
        finalNumero:
          type: string
        statusCartao:
          type: string
        limiteCredito:
          type: number
        limiteDisponivel:
          type: number
        valorFaturaAtual:
          type: number
        dataVencimentoFatura:
          type: string
          format: date

    FaturaResponse:
      type: object
      properties:
        faturaId:
          type: string
        valorTotal:
          type: number
        valorMinimo:
          type: number
        valorPago:
          type: number
        dataVencimento:
          type: string
          format: date
        dataPagamento:
          type: string
          format: date

    TransacaoCartaoResponse:
      type: object
      properties:
        transactionId:
          type: string
        valor:
          type: number
        moeda:
          type: string
        estabelecimento:
          type: string
        tipoTransacao:
          type: string
        dataTransacao:
          type: string
          format: date-time

    EmprestimoResponse:
      type: object
      properties:
        emprestimoId:
          type: string
        tipoEmprestimo:
          type: string
        valorContratado:
          type: number
        valorSaldoDevedor:
          type: number
        taxaJuros:
          type: number
        prazoMeses:
          type: integer
        parcelasPagas:
          type: integer
        parcelasRestantes:
          type: integer
        valorParcela:
          type: number
        dataContratacao:
          type: string
          format: date
        dataVencimentoPrimeiraParcela:
          type: string
          format: date
        statusEmprestimo:
          type: string

    SeguroResponse:
      type: object
      properties:
        apoliceId:
          type: string
        tipoSeguro:
          type: string
        nomeSeguradora:
          type: string
        premioMensal:
          type: number
        premioTotal:
          type: number
        valorSegurado:
          type: number
        dataInicio:
          type: string
          format: date
        dataFim:
          type: string
          format: date
        statusApolice:
          type: string

    PixResponse:
      type: object
      properties:
        pixId:
          type: string
        tipoPix:
          type: string
        chavedePix:
          type: string
        tipoChave:
          type: string
        valor:
          type: number
        moeda:
          type: string
        descricao:
          type: string
        statusPix:
          type: string
        dataPix:
          type: string
          format: date-time

    FapiInteractionId:
      type: string
      description: UUID de correlação FAPI (x-fapi-interaction-id)

    ErroResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string

security:
  - OAuth2: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  # ============================================================
  # Fase 1 — Consentimentos
  # ============================================================
  /open-finance/v1/consents:
    post:
      tags: [Consentimentos]
      summary: Criar consentimento
      operationId: criarConsentimento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentimentoRequest'
      responses:
        '201':
          description: Consentimento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentimentoResponse'
    get:
      tags: [Consentimentos]
      summary: Listar consentimentos
      operationId: listarConsentimentos
      responses:
        '200':
          description: Lista de consentimentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentimentoResponse'

  /open-finance/v1/consents/{consentId}:
    get:
      tags: [Consentimentos]
      summary: Buscar consentimento
      operationId: buscarConsentimento
      parameters:
        - name: consentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consentimento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentimentoResponse'
        '404':
          description: Não encontrado

  /open-finance/v1/consents/{consentId}/authorise:
    post:
      tags: [Consentimentos]
      summary: Autorizar consentimento
      operationId: autorizarConsentimento
      parameters:
        - name: consentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consentimento autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentimentoResponse'

  /open-finance/v1/consents/{consentId}/reject:
    post:
      tags: [Consentimentos]
      summary: Rejeitar consentimento
      operationId: rejeitarConsentimento
      parameters:
        - name: consentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consentimento rejeitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentimentoResponse'

  /open-finance/v1/consents/{consentId}/revoke:
    post:
      tags: [Consentimentos]
      summary: Revogar consentimento
      operationId: revogarConsentimento
      parameters:
        - name: consentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consentimento revogado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentimentoResponse'

  # ============================================================
  # Fase 1 — Contas
  # ============================================================
  /open-finance/v1/accounts:
    get:
      tags: [Contas]
      summary: Listar contas do cliente
      operationId: listarContas
      parameters:
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de contas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContaResponse'

  /open-finance/v1/accounts/{accountId}:
    get:
      tags: [Contas]
      summary: Buscar conta
      operationId: buscarConta
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Conta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContaResponse'
        '404':
          description: Não encontrada

  /open-finance/v1/accounts/{accountId}/balances:
    get:
      tags: [Contas]
      summary: Buscar saldos da conta
      operationId: buscarSaldos
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Saldos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaldoResponse'

  # ============================================================
  # Fase 1 — Transações
  # ============================================================
  /open-finance/v1/accounts/{accountId}/transactions:
    get:
      tags: [Transações]
      summary: Listar transações da conta
      operationId: listarTransacoes
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: fromDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: toDateTime
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de transações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransacaoResponse'

  # ============================================================
  # Fase 1 — Dados Pessoais
  # ============================================================
  /open-finance/v1/customers/personal/identifications:
    get:
      tags: [Dados Pessoais]
      summary: Identificações pessoais do cliente
      operationId: listarIdentificacoesPessoais
      parameters:
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de identificações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PessoaResponse'

  /open-finance/v1/customers/personal/addresses:
    get:
      tags: [Dados Pessoais]
      summary: Endereços pessoais do cliente
      operationId: listarEnderecosPessoais
      parameters:
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de endereços
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PessoaResponse'

  /open-finance/v1/customers/personal/phone-numbers:
    get:
      tags: [Dados Pessoais]
      summary: Telefones pessoais do cliente
      operationId: listarTelefonesPessoais
      parameters:
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de telefones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PessoaResponse'

  /open-finance/v1/customers/personal/email:
    get:
      tags: [Dados Pessoais]
      summary: E-mail pessoal do cliente
      operationId: listarEmailPessoal
      parameters:
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de e-mails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PessoaResponse'

  /open-finance/v1/customers/business/identifications:
    get:
      tags: [Dados Pessoais]
      summary: Identificações PJ do cliente
      operationId: listarIdentificacoesPJ
      parameters:
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de identificações PJ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PessoaResponse'

  /open-finance/v1/customers/business/addresses:
    get:
      tags: [Dados Pessoais]
      summary: Endereços PJ do cliente
      operationId: listarEnderecosPJ
      parameters:
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de endereços PJ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PessoaResponse'

  # ============================================================
  # Fase 2 — Cartões de Crédito
  # ============================================================
  /open-finance/v1/credit-cards:
    get:
      tags: [Cartões de Crédito]
      summary: Listar cartões de crédito
      operationId: listarCartoes
      parameters:
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de cartões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartaoResponse'

  /open-finance/v1/credit-cards/{creditCardId}:
    get:
      tags: [Cartões de Crédito]
      summary: Buscar cartão de crédito
      operationId: buscarCartao
      parameters:
        - name: creditCardId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Cartão encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartaoResponse'
        '404':
          description: Não encontrado

  /open-finance/v1/credit-cards/{creditCardId}/bills:
    get:
      tags: [Faturas]
      summary: Listar faturas do cartão
      operationId: listarFaturas
      parameters:
        - name: creditCardId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de faturas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FaturaResponse'

  /open-finance/v1/credit-cards/{creditCardId}/bills/{billId}:
    get:
      tags: [Faturas]
      summary: Buscar fatura do cartão
      operationId: buscarFatura
      parameters:
        - name: creditCardId
          in: path
          required: true
          schema:
            type: string
        - name: billId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Fatura encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaturaResponse'
        '404':
          description: Não encontrada

  /open-finance/v1/credit-cards/{creditCardId}/transactions:
    get:
      tags: [Transações de Cartão]
      summary: Listar transações do cartão
      operationId: listarTransacoesCartao
      parameters:
        - name: creditCardId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de transações do cartão
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransacaoCartaoResponse'

  # ============================================================
  # Fase 3 — Empréstimos
  # ============================================================
  /open-finance/v1/loans:
    get:
      tags: [Empréstimos]
      summary: Listar empréstimos do cliente
      operationId: listarEmprestimos
      parameters:
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de empréstimos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmprestimoResponse'

  /open-finance/v1/loans/{loanId}:
    get:
      tags: [Empréstimos]
      summary: Buscar empréstimo
      operationId: buscarEmprestimo
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Empréstimo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmprestimoResponse'
        '404':
          description: Não encontrado

  # ============================================================
  # Fase 3 — Seguros
  # ============================================================
  /open-finance/v1/insurance:
    get:
      tags: [Seguros]
      summary: Listar seguros do cliente
      operationId: listarSeguros
      parameters:
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de seguros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeguroResponse'

  /open-finance/v1/insurance/{insuranceId}:
    get:
      tags: [Seguros]
      summary: Buscar seguro
      operationId: buscarSeguro
      parameters:
        - name: insuranceId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Seguro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeguroResponse'
        '404':
          description: Não encontrado

  # ============================================================
  # Fase 3 — PIX
  # ============================================================
  /open-finance/v1/pix/credit-transfers:
    get:
      tags: [PIX]
      summary: Listar transferências PIX
      operationId: listarPix
      parameters:
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: Lista de PIX
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PixResponse'

  /open-finance/v1/pix/credit-transfers/{pixId}:
    get:
      tags: [PIX]
      summary: Buscar transferência PIX
      operationId: buscarPix
      parameters:
        - name: pixId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/FapiAuthDate'
        - $ref: '#/components/parameters/FapiIpAddress'
        - $ref: '#/components/parameters/FapiInteractionId'
      responses:
        '200':
          description: PIX encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PixResponse'
        '404':
          description: Não encontrado

components:
  parameters:
    FapiAuthDate:
      name: x-fapi-auth-date
      in: header
      required: true
